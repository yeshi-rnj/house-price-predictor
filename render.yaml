# Render Blueprint (must live at the repository root).
# Before deploying: train locally and commit backend/models/ (see README).
services:
  - type: web
    name: house-price-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-deploy.txt -r models/model-requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60 wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CORS_ORIGINS
        sync: false   # set to your deployed frontend URL in the Render dashboard
